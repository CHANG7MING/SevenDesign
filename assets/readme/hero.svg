<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SevenDesign: a design operating system for agents and frontend teams</title>
  <desc id="desc">A dark project map showing a brief moving through Explorer, Executor, and Reviewer into a shipped interface.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121817"/>
      <stop offset="1" stop-color="#202d28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ff47"/>
      <stop offset="1" stop-color="#a8e7a8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#wash)"/>
  <circle cx="1010" cy="58" r="170" fill="#d8ff47" opacity=".08" filter="url(#soft)"/>
  <path d="M54 326H1146" stroke="#dce9df" stroke-opacity=".16"/>
  <path d="M54 86H660" stroke="#dce9df" stroke-opacity=".16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#f3f7f1">
    <text x="58" y="64" font-size="14" letter-spacing="3.2" fill="#a8e7a8">DESIGN SYSTEM / TEAM PROTOCOL</text>
    <text x="58" y="164" font-size="58" font-weight="650" letter-spacing="-3">SEVEN</text>
    <text x="58" y="222" font-size="58" font-weight="650" letter-spacing="-3" fill="#d8ff47">DESIGN</text>
    <text x="60" y="270" font-size="20" fill="#c0ccc1">A design operating system for</text>
    <text x="60" y="298" font-size="20" fill="#c0ccc1">agents and frontend teams.</text>
    <text x="60" y="370" font-size="14" letter-spacing="1.3" fill="#91a196">BRIEF  →  EVIDENCE  →  INTERFACE  →  ACCEPTANCE</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(706 112)">
      <rect width="192" height="86" rx="14" fill="#17231f" stroke="#dce9df" stroke-opacity=".22"/>
      <text x="18" y="28" font-size="12" letter-spacing="1.8" fill="#a8e7a8">01 / EXPLORER</text>
      <text x="18" y="57" font-size="18" font-weight="600" fill="#f3f7f1">Gather evidence</text>
      <text x="18" y="75" font-size="13" fill="#91a196">read-only · Luna Medium</text>
    </g>
    <g transform="translate(926 112)">
      <rect width="192" height="86" rx="14" fill="#d8ff47"/>
      <text x="18" y="28" font-size="12" letter-spacing="1.8" fill="#263117">02 / EXECUTOR</text>
      <text x="18" y="57" font-size="18" font-weight="600" fill="#171b14">Build the slice</text>
      <text x="18" y="75" font-size="13" fill="#53632f">bounded · Luna High</text>
    </g>
    <g transform="translate(706 226)">
      <rect width="192" height="86" rx="14" fill="#17231f" stroke="#dce9df" stroke-opacity=".22"/>
      <text x="18" y="28" font-size="12" letter-spacing="1.8" fill="#a8e7a8">03 / REVIEWER</text>
      <text x="18" y="57" font-size="18" font-weight="600" fill="#f3f7f1">Check the craft</text>
      <text x="18" y="75" font-size="13" fill="#91a196">fresh context · Terra Medium</text>
    </g>
    <g transform="translate(926 226)">
      <rect width="192" height="86" rx="14" fill="#17231f" stroke="#dce9df" stroke-opacity=".22"/>
      <text x="18" y="28" font-size="12" letter-spacing="1.8" fill="#a8e7a8">MAIN THREAD</text>
      <text x="18" y="57" font-size="18" font-weight="600" fill="#f3f7f1">Accept the result</text>
      <text x="18" y="75" font-size="13" fill="#91a196">direction · safety · truth</text>
    </g>
  </g>

  <g fill="none" stroke="#a8e7a8" stroke-width="2" stroke-linecap="round" stroke-opacity=".7">
    <path d="M898 155h28"/>
    <path d="M1022 198v28"/>
    <path d="M926 269h-28"/>
    <path d="M804 226v-28"/>
  </g>
  <g fill="#d8ff47">
    <circle cx="926" cy="155" r="4"/>
    <circle cx="1022" cy="226" r="4"/>
    <circle cx="898" cy="269" r="4"/>
    <circle cx="804" cy="198" r="4"/>
  </g>
</svg>
